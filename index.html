<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจองโต๊ะ โรงอาหารวิศวะ (EN Canteen)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Kanit -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex flex-col justify-between">

    <!-- Header / Navbar -->
    <header class="bg-red-900 text-white shadow-md sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <span class="text-2xl">🍽️</span>
                <h1 class="text-xl font-bold tracking-wide">EN Canteen</h1>
            </div>

            <!-- Navigation Links & User Menu -->
            <div class="flex items-center space-x-4">
                <nav class="hidden md:flex space-x-3 text-sm">
                    <a href="index.html" class="px-3 py-1.5 rounded-lg bg-red-800 font-medium">จองโต๊ะ</a>
                    <a href="booking.html" class="px-3 py-1.5 rounded-lg hover:bg-red-800 transition">ตั๋วการจอง</a>
                    <a href="history.html" class="px-3 py-1.5 rounded-lg hover:bg-red-800 transition">ประวัติ</a>
                </nav>

                <!-- User Dropdown Menu -->
                <div class="relative">
                    <button onclick="toggleUserDropdown(event)" class="flex items-center space-x-2 bg-red-800 hover:bg-red-700 px-3 py-1.5 rounded-full text-sm transition focus:outline-none">
                        <span class="w-6 h-6 rounded-full bg-white text-red-900 flex items-center justify-center font-bold text-xs">U</span>
                        <span id="user-display-name">นักศึกษา KKU</span>
                        <span class="text-xs">▼</span>
                    </button>

                    <div id="user-dropdown" class="hidden absolute right-0 mt-2 w-56 bg-white rounded-xl shadow-lg border border-slate-100 py-2 text-slate-700 z-50">
                        <div class="px-4 py-2 border-b border-slate-100">
                            <p class="text-xs text-slate-400">เข้าใช้งานในชื่อ</p>
                            <p id="dropdown-user-email" class="text-sm font-semibold truncate">student@kkumail.com</p>
                        </div>
                        <button onclick="openChangeNameModal()" class="w-full text-left px-4 py-2 text-sm hover:bg-slate-50 flex items-center space-x-2">
                            <span>✏️</span> <span>เปลี่ยนชื่อผู้ใช้</span>
                        </button>
                        <button onclick="handleLogout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 flex items-center space-x-2">
                            <span>🔄</span> <span>รีเซ็ตระบบ / เริ่มใหม่</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-6xl mx-auto px-4 py-6 flex-grow w-full grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- Left Column: Floor & Table Selection (2 Cols) -->
        <div class="lg:col-span-2 space-y-6">
            
            <!-- Floor Selector -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200/80">
                <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center space-x-2">
                    <span>📍</span> <span>เลือกบริเวณ / ชั้น</span>
                </h2>
                <div class="grid grid-cols-2 gap-3">
                    <button id="btn-floor-upper" onclick="switchFloor('upper')" class="py-2.5 px-4 rounded-xl border-2 font-medium text-center transition bg-red-800 border-red-800 text-white shadow-sm">
                        🏢 ชั้น 1 (ส่วนหน้า)
                    </button>
                    <button id="btn-floor-lower" onclick="switchFloor('lower')" class="py-2.5 px-4 rounded-xl border-2 font-medium text-center transition bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100">
                        🔻 ชั้นใต้ดิน
                    </button>
                </div>
            </div>

            <!-- Table Grid Layout -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                        <span>🪑</span> <span>แผนผังโต๊ะอาหาร</span>
                    </h2>
                    <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-medium">ว่างพร้อมจอง</span>
                </div>

                <div id="table-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <!-- Dynamic Tables rendered via JS -->
                </div>
            </div>

            <!-- Time Slots -->
            <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200/80">
                <h2 class="text-lg font-bold text-slate-800 mb-3 flex items-center space-x-2">
                    <span>⏰</span> <span>เลือกรอบเวลาเข้าใช้งาน</span>
                </h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
                    <button onclick="selectTimeSlot('11:00 - 12:00', this)" class="time-btn active py-2.5 px-3 rounded-xl border text-sm font-medium transition bg-red-800 text-white border-2 shadow-sm">
                        11:00 - 12:00 น.
                    </button>
                    <button onclick="selectTimeSlot('12:00 - 13:00', this)" class="time-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition bg-slate-50 text-slate-700 hover:bg-slate-100">
                        12:00 - 13:00 น.
                    </button>
                    <button onclick="selectTimeSlot('13:00 - 14:00', this)" class="time-btn py-2.5 px-3 rounded-xl border text-sm font-medium transition bg-slate-50 text-slate-700 hover:bg-slate-100">
                        13:00 - 14:00 น.
                    </button>
                </div>
            </div>

        </div>

        <!-- Right Column: Booking Summary Card (1 Col) -->
        <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200/80 sticky top-20 space-y-5">
                <h2 class="text-lg font-bold text-slate-800 pb-3 border-b border-slate-100 flex items-center space-x-2">
                    <span>📋</span> <span>สรุปรายการจอง</span>
                </h2>

                <div class="space-y-3 text-sm">
                    <div class="flex justify-between items-center">
                        <span class="text-slate-500">โซนที่เลือก:</span>
                        <span id="summary-zone-badge" class="font-semibold bg-red-100 text-red-800 px-2.5 py-0.5 rounded-md">ชั้น 1</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-500">หมายเลขโต๊ะ:</span>
                        <span id="summary-table-no" class="font-bold text-base text-slate-800">โต๊ะ: A-01</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-slate-500">รอบเวลา:</span>
                        <span id="summary-time-slot" class="font-semibold text-slate-700">11:00 - 12:00 น.</span>
                    </div>
                </div>

                <hr class="border-slate-100">

                <button onclick="confirmBookingAndProceed()" class="w-full py-3 bg-red-800 hover:bg-red-700 text-white font-bold rounded-xl shadow-md shadow-red-800/20 transition duration-150 flex items-center justify-center space-x-2">
                    <span id="submit-btn-text">ยืนยันโต๊ะ A-01 👈</span>
                </button>
            </div>
        </div>

    </main>

    <!-- Change Name Modal -->
    <div id="name-modal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-xl border border-slate-100 space-y-4">
            <h3 class="text-lg font-bold text-slate-800">เปลี่ยนชื่อผู้ใช้งาน</h3>
            <input type="text" id="input-new-name" placeholder="ระบุชื่อของคุณ..." class="w-full px-4 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-800 text-sm">
            <div class="flex justify-end space-x-2">
                <button onclick="closeChangeNameModal()" class="px-4 py-2 text-sm rounded-xl text-slate-500 hover:bg-slate-100">ยกเลิก</button>
                <button onclick="saveNewName()" class="px-4 py-2 text-sm rounded-xl bg-red-800 text-white font-medium hover:bg-red-700">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // 1. ตัวแปรสถานะหลัก
        let selectedTable = 'A-01';
        let selectedTime = '11:00 - 12:00';
        let currentFloor = 'upper'; 

        // ข้อมูลโต๊ะตัวอย่าง
        const floorTables = {
            upper: ['A-01', 'A-02', 'A-03', 'A-04', 'B-01', 'B-02', 'B-03', 'B-04'],
            lower: ['C-01', 'C-02', 'C-03', 'C-04', 'D-01', 'D-02', 'D-03', 'D-04']
        };

        // 2. เริ่มต้นระบบเมื่อเปิดหน้า
        window.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
            renderTables();
            updateSummary();

            if (!localStorage.getItem('kku_booking_history')) {
                localStorage.setItem('kku_booking_history', JSON.stringify([]));
            }
        });

        // 3. สลับชั้น (Upper / Lower)
        function switchFloor(floor) {
            currentFloor = floor;
            
            const btnUpper = document.getElementById('btn-floor-upper');
            const btnLower = document.getElementById('btn-floor-lower');

            if (floor === 'upper') {
                btnUpper.className = 'py-2.5 px-4 rounded-xl border-2 font-medium text-center transition bg-red-800 border-red-800 text-white shadow-sm';
                btnLower.className = 'py-2.5 px-4 rounded-xl border-2 font-medium text-center transition bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100';
            } else {
                btnLower.className = 'py-2.5 px-4 rounded-xl border-2 font-medium text-center transition bg-red-800 border-red-800 text-white shadow-sm';
                btnUpper.className = 'py-2.5 px-4 rounded-xl border-2 font-medium text-center transition bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100';
            }

            // ตั้งค่าเลือกโต๊ะตัวแรกของชั้นนั้นอัตโนมัติ
            selectedTable = floorTables[floor][0];
            renderTables();
            updateSummary();
        }

        // 4. วาดการ์ดโต๊ะ
        function renderTables() {
            const grid = document.getElementById('table-grid');
            if (!grid) return;

            grid.innerHTML = '';
            const tables = floorTables[currentFloor];

            tables.forEach(tableId => {
                const isSelected = selectedTable === tableId;
                const btn = document.createElement('button');
                btn.onclick = () => selectTable(tableId);
                
                btn.className = `p-4 rounded-xl border-2 flex flex-col items-center justify-center space-y-1 transition ${
                    isSelected 
                    ? 'border-red-800 bg-red-50 text-red-900 shadow-sm font-bold' 
                    : 'border-slate-200 bg-slate-50/50 hover:bg-slate-100 text-slate-700'
                }`;

                btn.innerHTML = `
                    <span class="text-xl">🪑</span>
                    <span class="text-sm">${tableId}</span>
                `;
                grid.appendChild(btn);
            });
        }

        // 5. เลือกโต๊ะ
        function selectTable(id) {
            selectedTable = id;
            renderTables();
            updateSummary();
        }

        // 6. เลือกเวลา
        function selectTimeSlot(time, btn) {
            selectedTime = time;
            document.querySelectorAll('.time-btn').forEach(b => {
                b.classList.remove('active', 'bg-red-800', 'text-white', 'border-2', 'shadow-sm');
                b.classList.add('bg-slate-50', 'text-slate-700');
            });
            btn.classList.add('active', 'bg-red-800', 'text-white', 'border-2', 'shadow-sm');
            btn.classList.remove('bg-slate-50', 'text-slate-700');
            updateSummary();
        }

        // 7. อัปเดตกล่องสรุป
        function updateSummary() {
            const tableBadge = document.getElementById('summary-zone-badge');
            const tableNo = document.getElementById('summary-table-no');
            const timeSlot = document.getElementById('summary-time-slot');
            const submitBtnText = document.getElementById('submit-btn-text');

            if (tableBadge) tableBadge.innerText = currentFloor === 'upper' ? 'ชั้น 1' : 'ชั้นใต้ดิน';
            if (tableNo) tableNo.innerText = `โต๊ะ: ${selectedTable}`;
            if (timeSlot) timeSlot.innerText = `${selectedTime} น.`;
            if (submitBtnText) submitBtnText.innerText = `ยืนยันโต๊ะ ${selectedTable} 👈`;
        }

        // 8. เมนู User Dropdown & Profile
        function toggleUserDropdown(event) {
            event.stopPropagation();
            const dropdown = document.getElementById('user-dropdown');
            if (dropdown) dropdown.classList.toggle('hidden');
        }

        window.addEventListener('click', () => {
            const dropdown = document.getElementById('user-dropdown');
            if (dropdown && !dropdown.classList.contains('hidden')) {
                dropdown.classList.add('hidden');
            }
        });

        function loadUserProfile() {
            const name = localStorage.getItem('user_name') || 'นักศึกษา KKU';
            const email = localStorage.getItem('user_email') || 'student@kkumail.com';
            
            const nameEl = document.getElementById('user-display-name');
            const emailEl = document.getElementById('dropdown-user-email');
            
            if (nameEl) nameEl.innerText = name;
            if (emailEl) emailEl.innerText = email;
        }

        function openChangeNameModal() {
            const modal = document.getElementById('name-modal');
            const input = document.getElementById('input-new-name');
            if (modal) {
                modal.classList.remove('hidden');
                if (input) input.value = localStorage.getItem('user_name') || '';
            }
        }

        function closeChangeNameModal() {
            const modal = document.getElementById('name-modal');
            if (modal) modal.classList.add('hidden');
        }

        function saveNewName() {
            const input = document.getElementById('input-new-name');
            if (input && input.value.trim() !== '') {
                localStorage.setItem('user_name', input.value.trim());
                loadUserProfile();
                closeChangeNameModal();
                input.value = '';
            }
        }

        function handleLogout() {
            if (confirm('คุณต้องการรีเซ็ตข้อมูลทั้งหมดเพื่อเริ่มต้นใหม่ใช่หรือไม่?')) {
                localStorage.clear();
                location.reload();
            }
        }

        // 9. ยืนยันจองโต๊ะและบันทึกลงระบบ
        function confirmBookingAndProceed() {
            if (!selectedTable) {
                alert('กรุณาเลือกโต๊ะก่อนทำรายการครับ');
                return;
            }

            const bookingId = 'EN-' + Math.floor(100000 + Math.random() * 900000);
            const today = new Date();
            const dateOptions = { day: '2-digit', month: 'short', year: 'numeric' };
            const dateStr = today.toLocaleDateString('th-TH', dateOptions);

            const newBooking = {
                id: bookingId,
                table: selectedTable,
                zone: currentFloor === 'upper' ? 'ชั้น 1' : 'ชั้นใต้ดิน',
                datetime: `${dateStr} | ${selectedTime} น.`,
                status: 'completed',
                statusText: 'สำเร็จ'
            };

            const history = JSON.parse(localStorage.getItem('kku_booking_history')) || [];
            history.unshift(newBooking);
            localStorage.setItem('kku_booking_history', JSON.stringify(history));

            alert(`จองสำเร็จ!\nรหัสการจอง: ${bookingId}\nโต๊ะ: ${selectedTable} (${newBooking.zone})\nรอบเวลา: ${selectedTime} น.`);
            window.location.href = 'booking.html';
        }
    </script>
</body>
</html>
