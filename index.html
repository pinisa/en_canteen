    <script>
        let selectedTable = 'E2';
        let selectedTime = '12:00-12:30';
        let currentFloor = '1';

        window.addEventListener('DOMContentLoaded', () => {
            loadUserProfile();
            selectTable(selectedTable);
        });

        function switchFloor(floor) {
            currentFloor = floor;
            const map1 = document.getElementById('map-floor-1');
            const mapB = document.getElementById('map-floor-B');
            const tab1 = document.getElementById('tab-floor-1');
            const tabB = document.getElementById('tab-floor-B');

            if (floor === '1') {
                map1.classList.remove('hidden');
                mapB.classList.add('hidden');
                tab1.className = "px-6 py-2 rounded-xl transition bg-white text-slate-800 shadow";
                tabB.className = "px-6 py-2 rounded-xl transition text-slate-500 hover:text-slate-800";
                selectTable('E2');
            } else {
                map1.classList.add('hidden');
                mapB.classList.remove('hidden');
                tabB.className = "px-6 py-2 rounded-xl transition bg-white text-slate-800 shadow";
                tab1.className = "px-6 py-2 rounded-xl transition text-slate-500 hover:text-slate-800";
                selectTable('U11');
            }
        }

        function selectTable(id) {
            selectedTable = id;
            
            // รีเซ็ตสีโต๊ะทั้งหมด
            document.querySelectorAll('.btn-table').forEach(btn => {
                btn.className = btn.className.replace('bg-blue-600 ring-2 ring-blue-400', 'bg-emerald-500');
            });

            // เปลี่ยนโต๊ะที่เลือกเป็นสีน้ำเงิน
            const target = document.getElementById(`btn-${id}`);
            if (target) {
                target.className = target.className.replace('bg-emerald-500', 'bg-blue-600 ring-2 ring-blue-400');
            }

            document.getElementById('summary-table-id').innerText = `โต๊ะ: ${selectedTable}`;
        }

        function selectTime(timeStr, element) {
            selectedTime = timeStr;
            document.querySelectorAll('.btn-time').forEach(b => {
                b.className = "btn-time w-full py-2 bg-slate-800 text-xs rounded-xl hover:bg-slate-700 transition";
            });
            element.className = "btn-time w-full py-2 bg-blue-600 text-white font-bold text-xs rounded-xl transition shadow";
        }

        function confirmBooking() {
            localStorage.setItem('booking_seat', selectedTable);
            localStorage.setItem('booking_time', selectedTime);

            let history = JSON.parse(localStorage.getItem('kku_booking_history')) || [];
            history.unshift({
                id: Date.now(),
                table: selectedTable,
                floor: currentFloor === '1' ? 'ชั้น 1' : 'ชั้นใต้ดิน',
                time: selectedTime,
                date: new Date().toLocaleDateString('th-TH'),
                status: 'pending',
                statusText: 'รอเช็คอิน'
            });
            localStorage.setItem('kku_booking_history', JSON.stringify(history));

            alert(`จองสำเร็จ! โต๊ะ: ${selectedTable} รอบเวลา: ${selectedTime} น.`);
            window.location.href = 'booking.html';
        }

        function loadUserProfile() {
            const name = localStorage.getItem('user_name') || 'นักศึกษา KKU';
            const email = localStorage.getItem('user_email') || 'student@kkumail.com';
            document.getElementById('user-display-name').innerText = name;
            document.getElementById('dropdown-user-email').innerText = email;
        }

        function toggleUserDropdown(e) {
            e.stopPropagation();
            document.getElementById('user-dropdown').classList.toggle('hidden');
        }

        function handleLogout() {
            localStorage.clear();
            location.reload();
        }
    </script>
</body>
</html>
