    <script>
        let selectedTable = 'E2';

        function switchFloor(floor) {
            const f1 = document.getElementById('floor-1');
            const fB = document.getElementById('floor-B');
            const tab1 = document.getElementById('tab-1');
            const tabB = document.getElementById('tab-B');

            if(floor === '1') {
                f1.classList.remove('hidden');
                fB.classList.add('hidden');
                tab1.className = "px-6 py-1.5 rounded-lg bg-white text-slate-800 shadow-sm transition";
                tabB.className = "px-6 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition";
                selectTable('E2');
            } else {
                f1.classList.add('hidden');
                fB.classList.remove('hidden');
                tabB.className = "px-6 py-1.5 rounded-lg bg-white text-slate-800 shadow-sm transition";
                tab1.className = "px-6 py-1.5 rounded-lg text-slate-500 hover:text-slate-800 transition";
                selectTable('U11');
            }
        }

        function selectTable(id) {
            selectedTable = id;
            document.querySelectorAll('.btn-tbl').forEach(btn => {
                btn.classList.remove('bg-[#2962FF]');
                btn.classList.add('bg-[#00C853]');
            });

            const target = document.getElementById(`btn-${id}`);
            if(target) {
                target.classList.remove('bg-[#00C853]');
                target.classList.add('bg-[#2962FF]');
            }

            document.getElementById('selected-table-text').innerText = `โต๊ะ: ${selectedTable}`;
        }
    </script>
