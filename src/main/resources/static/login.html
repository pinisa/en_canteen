<script>
        function handleLoginSubmit(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value.trim();
            if (username) {
                const fullEmail = username.includes('@') ? username : `${username}@kkumail.com`;
                // ดึงชื่อนำหน้าก่อน @ มาเป็นชื่อผู้ใช้ตั้งต้น
                const displayName = username.includes('@') ? username.split('@')[0] : username;

                // บันทึก Key ให้ตรงกับที่ index.html เรียกใช้
                localStorage.setItem('user_email', fullEmail);
                localStorage.setItem('user_name', displayName);
                localStorage.setItem('is_logged_in', 'true');
                
                window.location.href = 'index.html';
            }
        }

        function loginWithKKUSSO() {
            // บันทึก Key ให้ตรงกับที่ index.html เรียกใช้
            localStorage.setItem('user_email', 'nepal@kkumail.com');
            localStorage.setItem('user_name', 'Nepal');
            localStorage.setItem('is_logged_in', 'true');
            
            window.location.href = 'index.html';
        }
    </script>
